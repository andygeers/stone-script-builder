<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stone Script Builder</title>
<style>
:root {
  --bg:       #000080;
  --bg-dark:  #00005A;
  --bg-mid:   #0000AA;
  --bg-card:  #000070;
  --text:     #FFFFFF;
  --dim:      #AAAAAA;
  --accent:   #FFFF55;
  --cyan:     #55FFFF;
  --green:    #55FF55;
  --red:      #FF5555;
  --orange:   #FF9933;
  --border:   #5555AA;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #00002A;
  color: var(--text);
  font-family: 'Courier New', 'Lucida Console', Consolas, monospace;
  font-size: 14px;
  min-height: 100vh;
  padding: 16px;
}

/* ── MAIN WINDOW ───────────────────────────────────── */
.window {
  background: var(--bg);
  max-width: 960px;
  margin: 0 auto;
  border: 2px solid var(--border);
  box-shadow: 4px 4px 0 #000040;
}

.titlebar {
  background: var(--accent);
  color: #000000;
  font-weight: bold;
  text-align: center;
  padding: 4px 12px;
  letter-spacing: 2px;
  font-size: 15px;
  border-bottom: 2px solid #CCCC00;
}

.subtitle {
  background: var(--bg-dark);
  color: var(--dim);
  text-align: center;
  padding: 2px 12px;
  font-size: 12px;
  border-bottom: 1px solid var(--border);
}

/* ── TABS ──────────────────────────────────────────── */
.tab-bar {
  display: flex;
  flex-wrap: wrap;
  background: var(--bg-dark);
  border-bottom: 2px solid var(--border);
  padding: 6px 6px 0;
  gap: 3px;
}

.tab {
  padding: 4px 12px;
  cursor: pointer;
  background: var(--bg-dark);
  color: var(--dim);
  border: 1px solid var(--border);
  border-bottom: none;
  user-select: none;
  font-family: inherit;
  font-size: 13px;
  position: relative;
  top: 1px;
}
.tab:hover { color: var(--accent); background: var(--bg-mid); }
.tab.active {
  background: var(--bg);
  color: var(--accent);
  border-color: var(--border);
  border-bottom: 2px solid var(--bg);
  font-weight: bold;
}
.tab .badge {
  font-size: 10px;
  color: var(--cyan);
  margin-left: 4px;
}
.tab-export { color: var(--green) !important; }
.tab-export.active { color: var(--green) !important; }

/* ── CONTENT ───────────────────────────────────────── */
.content {
  padding: 14px 16px;
  min-height: 420px;
}

.section-header {
  color: var(--cyan);
  font-weight: bold;
  margin-bottom: 10px;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
  letter-spacing: 1px;
}

.hint {
  color: var(--dim);
  font-size: 12px;
  margin-bottom: 12px;
}

/* ── RULE CARD ─────────────────────────────────────── */
.rule-card {
  border: 1px solid var(--border);
  margin-bottom: 10px;
  background: var(--bg-card);
}

.rule-card-header {
  background: var(--bg-dark);
  padding: 5px 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border);
}

.rule-num {
  color: var(--accent);
  font-weight: bold;
  font-size: 13px;
}

.rule-card-body { padding: 10px 12px; }

/* ── CONDITION / ACTION ROWS ───────────────────────── */
.row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 7px;
  flex-wrap: wrap;
}

.row-label {
  color: var(--cyan);
  font-weight: bold;
  min-width: 52px;
  font-size: 13px;
}

.row-label-dim {
  color: var(--dim);
  min-width: 78px;
  font-size: 13px;
}

.logic-and {
  color: var(--orange);
  font-weight: bold;
  font-size: 12px;
  padding: 0 2px;
}

.divider-line {
  border: none;
  border-top: 1px dashed var(--border);
  margin: 8px 0;
}

/* ── FORM ELEMENTS ─────────────────────────────────── */
select, input[type="text"], input[type="number"] {
  background: #000040;
  color: var(--accent);
  border: 1px solid var(--border);
  font-family: inherit;
  font-size: 13px;
  padding: 3px 6px;
}
select:focus, input:focus { outline: 1px solid var(--cyan); }
input[type="text"] { min-width: 160px; }
input[type="number"] { width: 65px; }
select { max-width: 220px; }

input[type="checkbox"] {
  accent-color: var(--accent);
  width: 14px;
  height: 14px;
  cursor: pointer;
  vertical-align: middle;
}

/* ── BUTTONS ───────────────────────────────────────── */
.btn {
  background: var(--bg-dark);
  color: var(--text);
  border: 1px solid var(--border);
  font-family: inherit;
  font-size: 13px;
  padding: 4px 12px;
  cursor: pointer;
  user-select: none;
}
.btn:hover { background: var(--bg-mid); color: var(--accent); }

.btn-sm {
  padding: 2px 8px;
  font-size: 12px;
}

.btn-primary {
  background: var(--accent);
  color: #000000;
  font-weight: bold;
  border-color: #CCCC00;
}
.btn-primary:hover { background: #FFFF99; }

.btn-danger { color: var(--red); }
.btn-danger:hover { background: #3A0000; color: var(--red); }

.btn-green { color: var(--green); border-color: var(--green); }
.btn-green:hover { background: #003A00; }

/* ── EMPTY STATE ───────────────────────────────────── */
.empty-state {
  color: var(--dim);
  text-align: center;
  padding: 28px;
  border: 1px dashed var(--border);
  margin-bottom: 12px;
  line-height: 1.8;
}

/* ── EXPORT ────────────────────────────────────────── */
.export-code {
  background: #000020;
  color: var(--green);
  font-family: inherit;
  font-size: 12px;
  width: 100%;
  min-height: 340px;
  border: 1px solid var(--border);
  resize: vertical;
  padding: 8px;
}
.export-code:focus { outline: 1px solid var(--cyan); }

/* ── STATUS BAR ────────────────────────────────────── */
.statusbar {
  background: var(--accent);
  color: #000000;
  padding: 3px 10px;
  font-size: 12px;
  display: flex;
  justify-content: space-between;
  border-top: 2px solid #CCCC00;
}

/* ── GLOBAL SECTION ────────────────────────────────── */
.global-card {
  border: 1px solid var(--border);
  margin-bottom: 14px;
  background: var(--bg-card);
}
.global-card-header {
  background: var(--bg-dark);
  padding: 5px 10px;
  color: var(--accent);
  font-weight: bold;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.global-card-body { padding: 10px 12px; }

/* ── PREVIEW TEXT ──────────────────────────────────── */
.preview-cond {
  font-size: 12px;
  color: var(--dim);
  margin-top: 6px;
  padding: 4px 8px;
  background: #000040;
  border-left: 2px solid var(--border);
}
.kw-field { color: var(--cyan); }
.kw-op    { color: var(--accent); }
.kw-val   { color: #FFFFFF; }
.kw-logic { color: var(--orange); }

/* ── SCROLLBAR ─────────────────────────────────────── */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--bg-dark); }
::-webkit-scrollbar-thumb { background: var(--border); }
</style>
</head>
<body>

<div class="window">
  <div class="titlebar">▓▓ STONE SCRIPT BUILDER v0.1 ▓▓</div>
  <div class="subtitle">╔══ Mind Stone Configuration Tool · StoneStoryRPG ══╗</div>

  <div class="tab-bar" id="tab-bar"></div>

  <div class="content" id="content"></div>

  <div class="statusbar">
    <span>TAB:Switch · ADD RULE:New condition block · DEL:Remove · Auto-saved to browser</span>
    <span style="display:flex; gap:12px; align-items:center;">
      <span id="status-msg">Ready ■</span>
      <span onclick="clearState()" style="cursor:pointer; text-decoration:underline; opacity:0.6;"
        title="Clear all rules and start over">[RESET]</span>
    </span>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
//  DATA DEFINITIONS
// ═══════════════════════════════════════════════════════════

// Short names used in tabs; LOC_DISPLAY used in content headers
const LOCATIONS  = ['Global', 'Canyon', 'Forest', 'Icy Ridge', 'Mine', 'Caves', 'Halls', 'Temple', 'Plateau'];
const LOC_KEYS   = ['global', 'canyon', 'forest', 'icy_ridge', 'mine', 'caves', 'halls', 'temple', 'plateau'];
const LOC_DISPLAY = ['Global', 'Deadwood Canyon', 'Mushroom Forest', 'Icy Ridge', 'Boiling Mine', 'Caves of Fear', 'Haunted Halls', 'Temple', 'Rocky Plateau'];
const PETS_TAB   = LOCATIONS.length;
const EXPORT_TAB = LOCATIONS.length + 1;

const PETS = [
  'Bear','BlackHole','Boo','Bunny','CatBalloon','CavePets','Chick','Crab','Cranius',
  'Dog','Dracula','Dragon','Fly','FoesNoMore','Frog','JackOLantern','LegsTurkey',
  'Mushroom','Panda','Pomeranian','RoyaltyDeliverer','Skully','Snail','SnowBunny',
  'Snowman','Spider','SpringBuddy','Stonehead','Sun','TarPusher','Wisp',
];

const ELEM_COLORS = {
  'Neutral':      '#AAAAAA',
  'Vigor':        '#55FF55',
  'Poison':       '#CC55CC',
  'Fire':         '#FF7722',
  'Aether':       '#7777FF',
  'Ice':          '#55FFFF',
  'All elements': '#FFFF55',
};

const LOC_INFO = {
  global:    { element: null,           weakness: null      },
  canyon:    { element: 'Neutral',      weakness: null      },
  forest:    { element: 'Vigor',        weakness: 'Poison'  },
  icy_ridge: { element: 'Ice',          weakness: 'Fire'    },
  mine:      { element: 'Fire',         weakness: 'Aether'  },
  caves:     { element: 'Poison',       weakness: 'Ice'     },
  halls:     { element: 'Aether',       weakness: 'Vigor'   },
  temple:    { element: 'Poison',       weakness: 'Ice'     },
  plateau:   { element: 'All elements', weakness: null      },
};

const WEAPONS = [
  '(none)',
  // Swords / Melee
  'heavy hammer', 'poison sword', 'ice sword', 'fire sword', 'fire big sword', 'aether sword',
  'vigor sword', 'bardiche', 'ice staff', 'skeleton_arm', 'blade_of_god',
  // Ranged
  'repeating crossbow', 'fire crossbow', 'ice crossbow', 'aether crossbow',
  // Wands
  'poison wand', 'fire wand', 'ice wand', 'aether wand', 'vigor wand',
  // Shields & Utility
  'shield', 'compound shield', 'dash', 'bash', 'Mind Stone', 'mind',
  // Healing / Pickup
  'oro', 'star',
  // Masks & Talismans
  'mask', 'fire_talisman', 'aether_talisman',
  '(other)',
];

const WEAPON_MODIFIERS = ['(none)', 'D', 'dL', 'dP', 'dF', 'dI', '*0'];

const FOE_TYPES = [
  '(any foe)',
  // Generic
  'boss',
  // Canyon
  'wasp', 'mosquito', 'stone scarab', 'xyloalgia',
  // Forest / Icy Ridge
  'giant ice elemental', 'ice wall', 'ice pillar',
  // Mine
  'bomb cart',
  // Caves
  'nail biter', 'not caviar', 'ceiling detector',
  // Halls
  'Pallas the Legless', 'Timmy', 'Boo',
  // Temple / Plateau
  'Nagaraja', 'dysangelos', 'acronian scout', 'Acronian Cultist',
  '(other)',
];

const POTION_TYPES = ['any', 'healing', 'cleansing', 'vampiric'];

const COND_FIELDS = [
  { v: 'foe',            label: 'Foe type',       type: 'foe'    },
  { v: 'foe.distance',   label: 'Foe distance',   type: 'num'    },
  { v: 'foe.armor',      label: 'Foe armor',      type: 'num'    },
  { v: 'foe.state',      label: 'Foe state #',    type: 'num'    },
  { v: 'foe.count',      label: 'Foe count',      type: 'num'    },
  { v: 'foe_element',   label: 'Foe element',    type: 'foe_element' },
  { v: 'hp',             label: 'HP (absolute)',   type: 'num'    },
  { v: 'hp_pct',         label: 'HP %',           type: 'pct'    },
  { v: 'armor',          label: 'My armor',       type: 'num'    },
  { v: 'summon.count',   label: 'Summon count',   type: 'num'    },
  { v: 'pickup.distance',label: 'Pickup dist.',   type: 'num'    },
  { v: 'item.potion',    label: 'Potion type',    type: 'potion' },
];

const OPERATORS     = ['=', '!=', '<', '<=', '>', '>='];
const NUM_OPS       = ['<', '<=', '>', '>=', '=', '!='];

// For "foe element" conditions: the element the foe IS, mapped to the element we should USE against them
const FOE_ELEMENT_WEAKNESS = { ice: 'fire', fire: 'aether', aether: 'vigor', vigor: 'poison', poison: 'ice' };
const FOE_ELEMENTS = ['ice', 'fire', 'aether', 'vigor', 'poison'];

// ═══════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════

let nextId = 1;
const uid = () => nextId++;

const makeRule = () => ({
  id: uid(),
  conditions: [],
  leftHand: '(none)',
  leftMod: '(none)',
  leftHandCustom: '',
  rightHand: '(none)',
  rightMod: '(none)',
  rightHandCustom: '',
  activateR: false,
  activatePotion: false,
  notes: '',
});

const makeCond = () => ({
  id: uid(),
  field: 'foe',
  operator: '=',
  value: 'boss',
  negate: false,
  customValue: '',
});

let state = {
  activeTab: 0,
  rules: Object.fromEntries(LOC_KEYS.map(k => [k, []])),
  // Per-location summon config (keyed by LOC_KEY, excludes 'global')
  locSummon: Object.fromEntries(
    LOC_KEYS.filter(k => k !== 'global').map(k => [k, { enabled: false, talismanType: 'fire_talisman' }])
  ),
  attackAnimCancel: false,
  pets: Object.fromEntries(PETS.map(p => [p, false])),
};

// ═══════════════════════════════════════════════════════════
//  RENDER ENGINE
// ═══════════════════════════════════════════════════════════

function render() {
  saveState();
  renderTabs();
  renderContent();
}

function renderTabs() {
  const bar = document.getElementById('tab-bar');
  let html = '';
  LOCATIONS.forEach((loc, i) => {
    const key = LOC_KEYS[i];
    const count = state.rules[key].length > 0 ? `<span class="badge">(${state.rules[key].length})</span>` : '';
    const active = state.activeTab === i ? 'active' : '';
    html += `<div class="tab ${active}" onclick="setTab(${i})">${loc}${count}</div>`;
  });
  const petsActive = state.activeTab === PETS_TAB ? 'active' : '';
  const petsCount = Object.values(state.pets).filter(Boolean).length;
  html += `<div class="tab ${petsActive}" onclick="setTab(${PETS_TAB})">Pets${petsCount > 0 ? `<span class="badge">(${petsCount})</span>` : ''}</div>`;
  const expActive = state.activeTab === EXPORT_TAB ? 'active' : '';
  html += `<div class="tab tab-export ${expActive}" onclick="setTab(${EXPORT_TAB})">▶ EXPORT</div>`;
  bar.innerHTML = html;
}

function setTab(i) {
  state.activeTab = i;
  render();
}

function renderContent() {
  const el = document.getElementById('content');
  if (state.activeTab === EXPORT_TAB) { el.innerHTML = buildExportHTML(); return; }
  if (state.activeTab === PETS_TAB)   { el.innerHTML = buildPetsHTML(); return; }
  if (state.activeTab === 0)          { el.innerHTML = buildGlobalHTML(); return; }
  el.innerHTML = buildLocationHTML(state.activeTab);
}

// ── GLOBAL TAB ──────────────────────────────────────────────

function buildGlobalHTML() {
  let h = `<div class="section-header">╔══ GLOBAL SETTINGS ══╗</div>`;
  h += `<div class="hint">Special behaviours and rules that run in every location.</div>`;

  // ── Special behaviours card ──
  h += `<div class="global-card">`;
  h += `<div class="global-card-header">┌─ SPECIAL BEHAVIOURS ───────────────────────────────</div>`;
  h += `<div class="global-card-body">`;

  // Attack animation cancel
  h += `<div class="row" style="margin-top:6px;"><label><input type="checkbox" ${state.attackAnimCancel ? 'checked' : ''}
    onchange="state.attackAnimCancel=this.checked;render()"> Attack animation cancelling</label></div>`;
  h += `<div style="padding-left:22px; font-size:12px; color:var(--dim); margin-bottom:4px;">
    Enhances the attack speed of most weapons by interrupting the idle frame between swings.
    <a href="https://stonestoryrpg.miraheze.org/wiki/Guide:Attack_Animation_Canceling"
      target="_blank" style="color:var(--cyan);">Learn more ↗</a>
  </div>`;
  if (state.attackAnimCancel) {
    h += `<div class="preview-cond" style="margin-left:22px; margin-top:4px;">
      <span class="kw-field">?item.left.state</span> <span class="kw-op">=</span> <span class="kw-val">3</span><br>
      &nbsp;&nbsp;equipL *0 wand <span style="color:var(--dim);">//trash</span><br>
      &nbsp;&nbsp;equipL @item.left@<br>
      <span class="kw-field">?item.right.state</span> <span class="kw-op">=</span> <span class="kw-val">3</span><br>
      &nbsp;&nbsp;equipR *0 shield <span style="color:var(--dim);">//trash</span><br>
      &nbsp;&nbsp;equip @item.right@
    </div>`;
  }

  h += `</div></div>`; // global-card-body / global-card

  // ── Global rules (same as any location tab) ──
  h += `<div class="section-header" style="margin-top:16px;">╔══ GLOBAL RULES ══╗</div>`;
  h += `<div class="hint">These if/else rules run before any location-specific rules. Good for potion use, debuff responses, etc.</div>`;

  const rules = state.rules['global'];
  if (rules.length === 0) {
    h += `<div class="empty-state">
      No global rules yet.<br>
      Example: add a rule with <em>HP % &lt; 40</em> + <em>Potion type = vampiric</em> → <em>activate potion</em>.
    </div>`;
  } else {
    rules.forEach((rule, idx) => {
      h += buildRuleCard(rule, idx, 'global', rules.length);
    });
  }

  h += `<button class="btn btn-primary" onclick="addRule('global')">[ + ADD GLOBAL RULE ]</button>`;
  return h;
}

// ── LOCATION TAB ─────────────────────────────────────────────

function buildLocationHTML(tabIdx) {
  const key     = LOC_KEYS[tabIdx];
  const name    = LOC_DISPLAY[tabIdx];
  const rules   = state.rules[key];
  const info    = LOC_INFO[key] || {};

  let h = `<div class="section-header">╔══ ${name.toUpperCase()} RULES ══╗</div>`;

  // Element / weakness banner
  if (info.element) {
    const elemCol = ELEM_COLORS[info.element] || '#FFFFFF';
    let banner = `<div style="display:flex; gap:24px; margin-bottom:10px; padding:5px 10px;
        background:var(--bg-dark); border:1px solid var(--border); font-size:13px;">`;
    banner += `<span>Location element: <strong style="color:${elemCol};">${info.element}</strong></span>`;
    if (info.weakness) {
      const weakCol = ELEM_COLORS[info.weakness] || '#FFFFFF';
      banner += `<span>Enemy weakness: <strong style="color:${weakCol};">${info.weakness}</strong>
        <span style="color:var(--dim); font-size:11px;">(favour ${info.weakness.toLowerCase()} weapons)</span></span>`;
    } else if (info.element === 'Neutral') {
      banner += `<span style="color:var(--dim); font-size:12px;">No elemental weakness — standard loadout applies</span>`;
    } else if (info.element === 'All elements') {
      banner += `<span style="color:var(--dim); font-size:12px;">Dysangelos rotates weaknesses — check foe buffs in rules</span>`;
    }
    banner += `</div>`;
    h += banner;
  }

  h += `<div class="hint">Rules are checked top-to-bottom. First matching rule wins (if / else-if chain).</div>`;

  // ── Per-location summon card ──
  const summon = state.locSummon[key];
  h += `<div class="global-card" style="margin-bottom:12px;">`;
  h += `<div class="global-card-header">┌─ AUTO SUMMON ───────────────────────────────────────</div>`;
  h += `<div class="global-card-body">`;
  h += `<div class="row">
    <label><input type="checkbox" ${summon.enabled ? 'checked' : ''}
      onchange="state.locSummon['${key}'].enabled=this.checked;render()">
      Re-cast talisman when summon.count = 0</label>
  </div>`;
  if (summon.enabled) {
    const talismans = ['fire_talisman', 'aether_talisman'];
    h += `<div class="row" style="padding-left:22px;">
      <span class="row-label-dim">Talisman:</span>
      <select onchange="state.locSummon['${key}'].talismanType=this.value">
        ${talismans.map(t => opt(t, t === summon.talismanType)).join('')}
      </select>
    </div>`;
    h += `<div class="preview-cond" style="margin-left:22px; margin-top:2px; font-size:11px;">
      // emits before your rules: <span class="kw-field">?summon.count</span> <span class="kw-op">=</span>
      <span class="kw-val">0</span> → equipR ${summon.talismanType} + activate
    </div>`;
  }
  h += `</div></div>`;

  if (rules.length === 0) {
    h += `<div class="empty-state">
      No rules yet for <strong style="color:var(--accent)">${name.toUpperCase()}</strong>.<br>
      Add a rule to define equipment and behaviour for this location.
    </div>`;
  } else {
    rules.forEach((rule, idx) => {
      h += buildRuleCard(rule, idx, key, rules.length);
    });
  }

  h += `<button class="btn btn-primary" onclick="addRule('${key}')">[ + ADD RULE ]</button>`;
  return h;
}

function buildRuleCard(rule, idx, key, total) {
  const condPreview = buildCondPreview(rule.conditions);

  let h = `<div class="rule-card">`;
  // Header
  h += `<div class="rule-card-header">`;
  h += `<span class="rule-num">┌─ RULE ${idx + 1} ${idx === 0 ? '<span style="color:var(--dim);font-size:11px;">(checked first)</span>' : idx === total-1 ? '<span style="color:var(--dim);font-size:11px;">(checked last / default)</span>' : ''}</span>`;
  h += `<span>`;
  if (idx > 0) h += `<button class="btn btn-sm" onclick="moveRule('${key}',${idx},-1)" title="Move up">▲</button> `;
  if (idx < total - 1) h += `<button class="btn btn-sm" onclick="moveRule('${key}',${idx},1)" title="Move down">▼</button> `;
  h += `<button class="btn btn-sm btn-danger" onclick="deleteRule('${key}',${idx})">[✕ DEL]</button>`;
  h += `</span>`;
  h += `</div>`;

  // Body
  h += `<div class="rule-card-body">`;

  // ── CONDITIONS ──
  h += `<div class="row"><span class="row-label">IF:</span>`;
  if (rule.conditions.length === 0) {
    h += `<span style="color:var(--dim); font-size:12px;">(no conditions — this rule always matches as a fallback)</span>`;
  }
  h += `</div>`;

  rule.conditions.forEach((cond, cidx) => {
    h += buildCondRow(cond, cidx, rule.id, key, idx);
  });

  h += `<div class="row">
    <button class="btn btn-sm" onclick="addCond('${key}',${idx})">[ + ADD CONDITION ]</button>
    ${rule.conditions.length > 0 ? `<span class="preview-cond" style="display:inline-block; margin-left:8px;">${condPreview}</span>` : ''}
  </div>`;

  h += `<hr class="divider-line">`;

  // ── ACTIONS ──
  h += `<div class="row"><span class="row-label" style="color:var(--green);">THEN:</span></div>`;

  // Left hand
  h += `<div class="row">
    <span class="row-label-dim">Left hand:</span>
    <select onchange="setRuleProp('${key}',${idx},'leftHand',this.value)">
      ${WEAPONS.map(w => opt(w, w === rule.leftHand)).join('')}
    </select>
    ${rule.leftHand === '(other)' ? `<input type="text" style="min-width:140px;" placeholder="e.g. fire sw" value="${escHtml(rule.leftHandCustom || '')}" onchange="setRuleProp('${key}',${idx},'leftHandCustom',this.value)">` : ''}
    <select title="Modifier (D=dual, dP=debuff poison, etc.)" onchange="setRuleProp('${key}',${idx},'leftMod',this.value)">
      ${WEAPON_MODIFIERS.map(m => opt(m, m === rule.leftMod, m === '(none)' ? 'No modifier' : m)).join('')}
    </select>
  </div>`;

  // Right hand
  h += `<div class="row">
    <span class="row-label-dim">Right hand:</span>
    <select onchange="setRuleProp('${key}',${idx},'rightHand',this.value)">
      ${WEAPONS.map(w => opt(w, w === rule.rightHand)).join('')}
    </select>
    ${rule.rightHand === '(other)' ? `<input type="text" style="min-width:140px;" placeholder="e.g. compound shield" value="${escHtml(rule.rightHandCustom || '')}" onchange="setRuleProp('${key}',${idx},'rightHandCustom',this.value)">` : ''}
    <select title="Modifier" onchange="setRuleProp('${key}',${idx},'rightMod',this.value)">
      ${WEAPON_MODIFIERS.map(m => opt(m, m === rule.rightMod, m === '(none)' ? 'No modifier' : m)).join('')}
    </select>
  </div>`;

  // Activate
  h += `<div class="row">
    <label><input type="checkbox" ${rule.activateR ? 'checked' : ''}
      onchange="setRuleProp('${key}',${idx},'activateR',this.checked)">
      Activate right-hand item <span style="color:var(--dim); font-size:11px;">(activate R)</span></label>
  </div>`;
  h += `<div class="row">
    <label><input type="checkbox" ${rule.activatePotion ? 'checked' : ''}
      onchange="setRuleProp('${key}',${idx},'activatePotion',this.checked)">
      Use potion <span style="color:var(--dim); font-size:11px;">(activate potion)</span></label>
  </div>`;

  // Notes
  h += `<div class="row">
    <span class="row-label-dim" style="color:var(--dim);">// Comment:</span>
    <input type="text" style="flex:1; max-width:500px;"
      placeholder="Optional note about this rule..."
      value="${escHtml(rule.notes)}"
      onchange="setRuleProp('${key}',${idx},'notes',this.value)">
  </div>`;

  h += `</div>`; // rule-card-body
  h += `</div>`; // rule-card
  return h;
}

function buildCondRow(cond, cidx, ruleId, key, ruleIdx) {
  const fieldDef = COND_FIELDS.find(f => f.v === cond.field) || COND_FIELDS[0];
  const isFoeElement = fieldDef.type === 'foe_element';
  const ops = (fieldDef.type === 'foe' || fieldDef.type === 'potion') ? ['=', '!='] : NUM_OPS;

  let h = `<div class="row" id="cr-${ruleId}-${cidx}">`;
  if (cidx > 0) h += `<span class="logic-and">AND</span>`;

  // NOT checkbox (hidden for foe_element — the immunity check is always implicit)
  if (!isFoeElement) {
    h += `<label style="font-size:12px; color:var(--dim);">
      <input type="checkbox" ${cond.negate ? 'checked' : ''}
        onchange="setCondProp('${key}',${ruleIdx},${cidx},'negate',this.checked)"> NOT
    </label>`;
  }

  // Field selector
  h += `<select onchange="setCondField('${key}',${ruleIdx},${cidx},this.value)">
    ${COND_FIELDS.map(f => opt(f.v, f.v === cond.field, f.label)).join('')}
  </select>`;

  // Operator (hidden for foe_element — it's always an "is" check)
  if (!isFoeElement) {
    h += `<select onchange="setCondProp('${key}',${ruleIdx},${cidx},'operator',this.value)">
      ${ops.map(o => opt(o, o === cond.operator)).join('')}
    </select>`;
  }

  // Value
  if (fieldDef.type === 'foe') {
    h += `<select onchange="setCondProp('${key}',${ruleIdx},${cidx},'value',this.value)">
      ${FOE_TYPES.map(f => opt(f, f === cond.value)).join('')}
    </select>`;
    // Show text input when "(other)" is selected
    if (cond.value === '(other)') {
      h += `<input type="text" style="min-width:140px;" placeholder='e.g. "nail biter"'
        value="${escHtml(cond.customValue || '')}"
        onchange="setCondProp('${key}',${ruleIdx},${cidx},'customValue',this.value)">`;
    }
  } else if (fieldDef.type === 'foe_element') {
    const weakEl = FOE_ELEMENT_WEAKNESS[cond.value] || '?';
    const elemCol = ELEM_COLORS[cond.value.charAt(0).toUpperCase() + cond.value.slice(1)] || '#FFF';
    const weakCol = ELEM_COLORS[weakEl.charAt(0).toUpperCase() + weakEl.slice(1)] || '#FFF';
    h += `<select onchange="setCondProp('${key}',${ruleIdx},${cidx},'value',this.value)">
      ${FOE_ELEMENTS.map(e => opt(e, e === cond.value)).join('')}
    </select>`;
    h += `<span style="font-size:11px; color:var(--dim);">
      → foe is <strong style="color:${elemCol};">${cond.value}</strong>,
      use <strong style="color:${weakCol};">${weakEl}</strong> weapons
    </span>`;
  } else if (fieldDef.type === 'potion') {
    h += `<select onchange="setCondProp('${key}',${ruleIdx},${cidx},'value',this.value)">
      ${POTION_TYPES.filter(p=>p!=='any').map(p => opt(p, p === cond.value)).join('')}
    </select>`;
  } else if (fieldDef.type === 'pct') {
    h += `<input type="number" min="0" max="100" value="${cond.value}"
      onchange="setCondProp('${key}',${ruleIdx},${cidx},'value',this.value)">
      <span style="color:var(--dim); font-size:12px;">%</span>`;
  } else {
    h += `<input type="number" min="0" value="${cond.value}"
      onchange="setCondProp('${key}',${ruleIdx},${cidx},'value',this.value)">`;
  }

  h += `<button class="btn btn-sm btn-danger" onclick="removeCond('${key}',${ruleIdx},${cidx})">[✕]</button>`;
  h += `</div>`;
  return h;
}

function buildCondPreview(conditions) {
  if (!conditions || conditions.length === 0) return '';
  return conditions.map(c => {
    const neg = c.negate ? '<span style="color:var(--red);">!</span>' : '';
    if (c.field === 'hp_pct') {
      return `${neg}<span class="kw-field">hp</span> <span class="kw-op">${c.operator}</span> <span class="kw-val">maxhp * ${(+c.value/100).toFixed(2)}</span>`;
    }
    if (c.field === 'foe_element') {
      const weakEl = FOE_ELEMENT_WEAKNESS[c.value] || '?';
      const elemCol = ELEM_COLORS[c.value.charAt(0).toUpperCase() + c.value.slice(1)] || '#FFF';
      const weakCol = ELEM_COLORS[weakEl.charAt(0).toUpperCase() + weakEl.slice(1)] || '#FFF';
      return `<span class="kw-field">foe</span> <span class="kw-op">=</span> <span style="color:${elemCol};">${c.value}</span> <span class="kw-logic">&amp;</span> <span style="color:var(--dim);">!(adaptive <span class="kw-logic">&amp;</span> <span style="color:${weakCol};">${weakEl}</span> prot)</span>`;
    }
    const foeVal = (c.field === 'foe' && c.value === '(other)') ? (c.customValue || '…') : c.value;
    const opStr = c.operator === '!=' ? '!' : c.operator;
    return `${neg}<span class="kw-field">${c.field}</span> <span class="kw-op">${opStr}</span> <span class="kw-val">${foeVal}</span>`;
  }).join(' <span class="kw-logic">&amp;</span> ');
}

// ── PETS TAB ─────────────────────────────────────────────────

function buildPetsHTML() {
  const selected = Object.values(state.pets).filter(Boolean).length;
  let h = `<div class="section-header">╔══ PETS ══╗</div>`;
  h += `<div class="hint">${selected} pet${selected !== 1 ? 's' : ''} selected — each adds an <code style="color:var(--accent);">import Pets/Name</code> line to your script.</div>`;

  h += `<div class="row" style="margin-bottom:10px;">
    <button class="btn btn-sm" onclick="selectAllPets(true)">[ SELECT ALL ]</button>
    <button class="btn btn-sm" onclick="selectAllPets(false)">[ CLEAR ALL ]</button>
  </div>`;

  // 3-column grid
  h += `<div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:4px 16px;">`;
  PETS.forEach(pet => {
    const checked = state.pets[pet] ? 'checked' : '';
    h += `<label style="display:flex; align-items:center; gap:6px; padding:3px 0; cursor:pointer;">
      <input type="checkbox" ${checked} onchange="togglePet('${pet}',this.checked)">
      <span style="color:${checked ? 'var(--accent)' : 'var(--text)'};">${pet}</span>
    </label>`;
  });
  h += `</div>`;
  return h;
}

function togglePet(pet, val) {
  state.pets[pet] = val;
  render();
}

function selectAllPets(val) {
  PETS.forEach(p => state.pets[p] = val);
  render();
}

// ── EXPORT TAB ───────────────────────────────────────────────

function buildExportHTML() {
  const script = generateScript();
  let h = `<div class="section-header">╔══ EXPORT STONESCRIPT ══╗</div>`;
  h += `<div class="hint">Copy this into your Mind Stone in-game.</div>`;
  h += `<div class="row">
    <button class="btn btn-primary" onclick="copyScript()">[ COPY TO CLIPBOARD ]</button>
    <span style="color:var(--dim); font-size:12px; margin-left:8px;" id="copy-msg"></span>
  </div>`;
  h += `<textarea class="export-code" id="export-code" readonly>${escHtml(script)}</textarea>`;
  return h;
}

function copyScript() {
  const ta = document.getElementById('export-code');
  if (!ta) return;
  navigator.clipboard.writeText(ta.value).then(() => {
    const msg = document.getElementById('copy-msg');
    if (msg) { msg.textContent = '✓ Copied!'; msg.style.color = 'var(--green)'; }
    setStatus('Copied to clipboard!');
    setTimeout(() => { if (msg) msg.textContent = ''; setStatus('Ready ■'); }, 3000);
  });
}

// ═══════════════════════════════════════════════════════════
//  STONESCRIPT GENERATOR
// ═══════════════════════════════════════════════════════════

function generateScript() {
  const lines = [];
  lines.push('// Generated by Stone Script Builder v0.1 - by Andy Geers https://github.com/andygeers/stone-script-builder/');
  lines.push('import UI/MindstoneButton');
  const selectedPets = PETS.filter(p => state.pets[p]);
  selectedPets.forEach(p => lines.push(`import Pets/${p}`));
  if (selectedPets.length > 0) lines.push('');

  // Attack animation cancelling
  if (state.attackAnimCancel) {
    lines.push('// Attack animation cancelling — enhances attack speed of most weapons');
    lines.push('// See: https://stonestoryrpg.miraheze.org/wiki/Guide:Attack_Animation_Canceling');
    lines.push('?item.left.state = 3');
    lines.push('  equipL *0 wand //trash');
    lines.push('  equipL @item.left@');
    lines.push('?item.right.state = 3');
    lines.push('  equipR *0 shield //trash');
    lines.push('  equip @item.right@');
    lines.push('');
  }

  // Global rules (no loc wrapper)
  const globalRules = state.rules['global'];
  if (globalRules.length > 0) {
    globalRules.forEach((rule, idx) => {
      const prefix = idx === 0 ? '?' : ':?';
      const condStr = buildCondStr(rule.conditions);
      if (condStr) {
        lines.push(`${prefix}${condStr}`);
      } else {
        lines.push(idx === 0 ? '// (global fallback — no condition)' : ':');
      }
      if (rule.notes) lines.push(`  // ${rule.notes}`);
      const lw = weapStr(rule.leftHand, rule.leftMod, rule.leftHandCustom);
      const rw = weapStr(rule.rightHand, rule.rightMod, rule.rightHandCustom);
      if (lw && rw && lw === rw) { lines.push(`  equip ${lw}`); }
      else { if (lw) lines.push(`  equipL ${lw}`); if (rw) lines.push(`  equipR ${rw}`); }
      if (rule.activateR)      lines.push(`  ?item.CanActivate()\n    activate R`);
      if (rule.activatePotion) lines.push(`  activate potion`);
    });
    lines.push('');
  }

  // Per-location
  LOC_KEYS.forEach((key, li) => {
    if (key === 'global') return;
    const rules = state.rules[key];
    const summon = state.locSummon[key] || {};
    const hasSummon = summon.enabled;

    // Only emit if there are rules (or summon is enabled)
    if (rules.length === 0 && !hasSummon) return;

    lines.push(`?loc = ${key}`);

    let ruleStart = 0;

    // Summon block first
    if (hasSummon) {
      lines.push(`  ?summon.count = 0`);
      lines.push(`    equipR ${summon.talismanType}`);
      lines.push(`    ?item.CanActivate()`);
      lines.push(`      activate R`);
      ruleStart = 1;
    }

    rules.forEach((rule, idx) => {
      const isFirst = (idx === 0 && ruleStart === 0) || (idx === 0 && ruleStart === 1 && hasSummon);
      const prefix = (idx === 0 && ruleStart === 0) ? '  ?' : '  :?';
      const condStr = buildCondStr(rule.conditions);

      if (condStr) {
        lines.push(`${prefix}${condStr}`);
      } else {
        // No conditions = else/default
        lines.push(`  :`);
      }

      if (rule.notes) lines.push(`    // ${rule.notes}`);

      // Equipment
      const lw = weapStr(rule.leftHand, rule.leftMod, rule.leftHandCustom);
      const rw = weapStr(rule.rightHand, rule.rightMod, rule.rightHandCustom);

      if (lw && rw && lw === rw) {
        lines.push(`    equip ${lw}`);
      } else {
        if (lw) lines.push(`    equipL ${lw}`);
        if (rw) lines.push(`    equipR ${rw}`);
      }

      if (rule.activateR)      lines.push(`    ?item.CanActivate()\n      activate R`);
      if (rule.activatePotion) lines.push(`    activate potion`);
    });

    if (hasSummon && rules.length > 0) {
      // close the summon block with a colon before the first real rule
      // (already handled by prefix logic above — this is a simplification)
    }

    lines.push('');
  });

  return lines.join('\n');
}

function weapStr(weapon, mod, customVal) {
  if (!weapon || weapon === '(none)') return null;
  const name = weapon === '(other)' ? (customVal || '') : weapon;
  if (!name) return null;
  const m = (!mod || mod === '(none)') ? '' : ` ${mod}`;
  return `${name}${m}`;
}

function buildCondStr(conditions) {
  if (!conditions || conditions.length === 0) return '';
  return conditions.map(c => {
    const neg = c.negate ? '!' : '';
    if (c.field === 'hp_pct') {
      return `${neg}hp ${c.operator} maxhp * ${(+c.value/100).toFixed(2)}`;
    }
    if (c.field === 'foe_element') {
      const weakEl = FOE_ELEMENT_WEAKNESS[c.value] || c.value;
      return `foe = ${c.value} & !(foe.buffs.string = adaptive & foe.buffs.string = ${weakEl})`;
    }
    const opStr = c.operator === '!=' ? '!' : c.operator;
    const val = (c.field === 'foe' && c.value === '(other)') ? (c.customValue || '') : c.value;
    return `${neg}${c.field} ${opStr} ${val}`;
  }).join(' & ');
}

// ═══════════════════════════════════════════════════════════
//  STATE MUTATIONS
// ═══════════════════════════════════════════════════════════

function addRule(key) {
  state.rules[key].push(makeRule());
  render();
  setStatus(`Rule added to ${key}`);
}

function deleteRule(key, idx) {
  state.rules[key].splice(idx, 1);
  render();
  setStatus('Rule deleted');
}

function moveRule(key, idx, dir) {
  const arr = state.rules[key];
  const ni = idx + dir;
  if (ni < 0 || ni >= arr.length) return;
  [arr[idx], arr[ni]] = [arr[ni], arr[idx]];
  render();
}

function setRuleProp(key, idx, prop, val) {
  state.rules[key][idx][prop] = val;
  render();
}

function addCond(key, ruleIdx) {
  state.rules[key][ruleIdx].conditions.push(makeCond());
  render();
}

function removeCond(key, ruleIdx, condIdx) {
  state.rules[key][ruleIdx].conditions.splice(condIdx, 1);
  render();
}

function setCondProp(key, ruleIdx, condIdx, prop, val) {
  state.rules[key][ruleIdx].conditions[condIdx][prop] = val;
  render();
}

function setCondField(key, ruleIdx, condIdx, fieldVal) {
  const cond = state.rules[key][ruleIdx].conditions[condIdx];
  cond.field = fieldVal;
  const fd = COND_FIELDS.find(f => f.v === fieldVal);
  // Reset value to sensible default
  if (fd.type === 'foe')         { cond.value = 'boss'; cond.operator = '='; }
  else if (fd.type === 'potion') { cond.value = 'healing'; cond.operator = '='; }
  else if (fd.type === 'foe_element') { cond.value = 'ice'; cond.operator = '='; }
  else                           { cond.value = '10'; cond.operator = '<'; }
  render();
}

// ═══════════════════════════════════════════════════════════
//  PERSISTENCE (localStorage)
// ═══════════════════════════════════════════════════════════

const STORAGE_KEY = 'stone-script-builder-v1';

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      nextId,
      activeTab: state.activeTab,
      rules: state.rules,
      locSummon: state.locSummon,
      attackAnimCancel: state.attackAnimCancel,
      pets: state.pets,
    }));
  } catch(e) { /* localStorage unavailable */ }
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);

    if (saved.nextId)  nextId = saved.nextId;
    if (typeof saved.activeTab === 'number') state.activeTab = saved.activeTab;
    if (typeof saved.attackAnimCancel === 'boolean') state.attackAnimCancel = saved.attackAnimCancel;

    // Merge saved rules — preserve default empty arrays for any new location keys
    if (saved.rules) {
      LOC_KEYS.forEach(k => {
        if (Array.isArray(saved.rules[k])) state.rules[k] = saved.rules[k];
      });
    }

    // Merge saved locSummon — preserve defaults for any new location keys
    if (saved.locSummon) {
      LOC_KEYS.filter(k => k !== 'global').forEach(k => {
        if (saved.locSummon[k]) state.locSummon[k] = saved.locSummon[k];
      });
    }

    // Merge saved pets — preserve defaults for any new pets added later
    if (saved.pets) {
      PETS.forEach(p => {
        if (typeof saved.pets[p] === 'boolean') state.pets[p] = saved.pets[p];
      });
    }
  } catch(e) { /* Corrupt data — start fresh */ }
}

function clearState() {
  if (!confirm('Reset ALL rules and settings? This cannot be undone.')) return;
  try { localStorage.removeItem(STORAGE_KEY); } catch(e) {}
  location.reload();
}

// ═══════════════════════════════════════════════════════════
//  UTILITIES
// ═══════════════════════════════════════════════════════════

function opt(val, selected, label) {
  return `<option value="${escHtml(val)}" ${selected ? 'selected' : ''}>${escHtml(label !== undefined ? label : val)}</option>`;
}

function escHtml(s) {
  if (s === undefined || s === null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function setStatus(msg) {
  const el = document.getElementById('status-msg');
  if (el) el.textContent = msg + ' ■';
}

// ═══════════════════════════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════════════════════════

loadState();
render();
</script>
